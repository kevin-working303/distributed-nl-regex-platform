# ---------------------------------------------------------------------------
# Distributed NL-to-Regex Data Processing Platform
# `docker compose up --build` brings up the entire stack.
# ---------------------------------------------------------------------------

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
  POSTGRES_DB: ${POSTGRES_DB:-regexdb}
  POSTGRES_USER: ${POSTGRES_USER:-regex}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regexpass}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  SPARK_MASTER: ${SPARK_MASTER:-local[*]}
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
  SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-2g}
  SPARK_ROWS_PER_PARTITION: ${SPARK_ROWS_PER_PARTITION:-200000}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
  LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-86400}
  RESULTS_DIR: ${RESULTS_DIR:-/data/results}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal-only (no host port) to avoid clashing with any host Redis on 6379.
    # Services reach it over the compose network at redis:6379.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regexdb}
      POSTGRES_USER: ${POSTGRES_USER:-regex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regexpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regex}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      <<: *backend-env
    volumes:
      - results:/data/results
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker --loglevel=info --concurrency=1 -Q processing
    environment:
      <<: *backend-env
    volumes:
      - results:/data/results
      - spark-ivy:/home/app/.ivy2
    # Scale horizontally with:  docker compose up --scale worker=3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config flower --port=5555 --broker=${CELERY_BROKER_URL:-redis://redis:6379/1}
    environment:
      <<: *backend-env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = frontend calls relative /api (proxied by nginx in compose, and
        # by Caddy→nginx in prod). Only set this to an absolute backend URL for a
        # separate-origin host (e.g. a PaaS static site), which then needs CORS.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  results:
  spark-ivy:
